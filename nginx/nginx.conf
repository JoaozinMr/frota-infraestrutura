# Load balancer (porta 80): round robin entre as réplicas da API de Ingestão e proxy para a API de Alertas.
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    # 2.000 VUs do k6 = 2.000 conexões de cliente + conexões upstream.
    worker_connections 16384;
    multi_accept on;
}

http {
    log_format json escape=json
        '{"@t":"$time_iso8601","Service":"nginx","method":"$request_method","uri":"$request_uri",'
        '"status":$status,"request_time":$request_time,"upstream":"$upstream_addr",'
        '"upstream_time":"$upstream_response_time","correlation_id":"$upstream_http_x_correlation_id"}';
    # Só loga erros (4xx/5xx): em teste de carga, um log por requisição vira gargalo de I/O.
    # O header X-Correlation-ID do cliente é repassado às APIs sem alteração.
    map $status $loggable {
        ~^[23] 0;
        default 1;
    }
    access_log /dev/stdout json if=$loggable;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 10000;
    client_max_body_size 64k;  # mesmo limite da API de Ingestão (corpos maiores: 413)

    # DNS interno do Docker. No Compose, o DNS resolve as réplicas dos serviços.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream api_ingestao {
        zone api_ingestao 64k;
        # Cada IP retornado pelo DNS (uma réplica) vira um servidor do round robin.
        server api-ingestao:8080 max_fails=3 fail_timeout=5s;
        keepalive 256;
    }

    upstream api_alertas {
        zone api_alertas 64k;
        server api-alertas:8080 max_fails=3 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 80 default_server;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        # A Ingestão espera até ~10s pelo broker antes de responder 503.
        proxy_read_timeout 15s;
        # POST não é repetido em outra réplica depois de enviado (padrão do Nginx);
        # só falhas de conexão vão para a próxima réplica.
        proxy_next_upstream error timeout;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Telemetria (simulador e k6) -> réplicas da API de Ingestão.
        location /api/telemetry {
            proxy_pass http://api_ingestao;
        }

        # Alertas (Worker usa a rede interna; aqui é a consulta para painéis/clientes).
        location /api/alerts {
            proxy_pass http://api_alertas;
        }

        # Health por serviço (Worker, Ingestão e Alertas expõem /health na própria porta).
        location = /health/ingestao {
            proxy_pass http://api_ingestao/health/ready;
        }

        location = /health/alertas {
            proxy_pass http://api_alertas/health;
        }

        location = / {
            proxy_pass http://api_ingestao/;
        }

        location / {
            return 404;
        }
    }
}
