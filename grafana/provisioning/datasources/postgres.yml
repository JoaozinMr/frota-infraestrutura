apiVersion: 1

datasources:
  - name: Frota PostgreSQL
    uid: frota-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_leitura
    isDefault: true
    editable: false
    jsonData:
      database: frota
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
      timeInterval: 5s
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
